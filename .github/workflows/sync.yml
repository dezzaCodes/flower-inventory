name: Sync from Google Sheet

on:
  schedule:
    - cron: "0 19 * * *" # 19:00 UTC = 6am Sydney (5am in winter)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Pull the sheet into index.html and images.json
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python sync.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html images.json photos
          git diff --cached --quiet || { git commit -m "Sync from Google Sheet" && git push; }
