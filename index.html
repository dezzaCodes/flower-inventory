<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Flower Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F4F6F1; --surface:#FFFFFF; --sunk:#EBEFE7; --ink:#1E2620; --muted:#5D6A61; --faint:#8A968D;
  --line:#DCE2D8; --accent:#7B2E63; --accent-ink:#FFFFFF; --accent-soft:#F3E5EE;
  --moss:#3D6A48; --moss-soft:#E2EEE4; --clay:#8A5A2B; --clay-soft:#F3E9DD;
  --shadow:0 12px 40px rgba(30,38,32,.16);
  --c1-bg:#E1ECF7; --c1-fg:#24548A; --c2-bg:#F6EBD6; --c2-fg:#7A5414; --c3-bg:#DCF0EC; --c3-fg:#1F6458;
  --c4-bg:#F7E1E6; --c4-fg:#8A2F45; --c5-bg:#E9E3F6; --c5-fg:#4F3A85; --c6-bg:#ECEFD9; --c6-fg:#55601F;
  --display:"Young Serif",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#121613; --surface:#1A201C; --sunk:#151A16; --ink:#E7ECE5; --muted:#A0ACA3; --faint:#76827A;
  --line:#2C352F; --accent:#DE93C4; --accent-ink:#1E1219; --accent-soft:#3A2333;
  --moss:#92C59F; --moss-soft:#1F3226; --clay:#E0B17F; --clay-soft:#3A2C1D;
  --shadow:0 12px 40px rgba(0,0,0,.5);
  --c1-bg:#1C2E44; --c1-fg:#9CC3EE; --c2-bg:#3A2E19; --c2-fg:#E6C27F; --c3-bg:#17332E; --c3-fg:#8ED3C4;
  --c4-bg:#3D2028; --c4-fg:#EFA2B4; --c5-bg:#2B2440; --c5-fg:#C4B3F0; --c6-bg:#2E3218; --c6-fg:#C9D48C;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121613; --surface:#1A201C; --sunk:#151A16; --ink:#E7ECE5; --muted:#A0ACA3; --faint:#76827A;
  --line:#2C352F; --accent:#DE93C4; --accent-ink:#1E1219; --accent-soft:#3A2333;
  --moss:#92C59F; --moss-soft:#1F3226; --clay:#E0B17F; --clay-soft:#3A2C1D;
  --shadow:0 12px 40px rgba(0,0,0,.5);
  --c1-bg:#1C2E44; --c1-fg:#9CC3EE; --c2-bg:#3A2E19; --c2-fg:#E6C27F; --c3-bg:#17332E; --c3-fg:#8ED3C4;
  --c4-bg:#3D2028; --c4-fg:#EFA2B4; --c5-bg:#2B2440; --c5-fg:#C4B3F0; --c6-bg:#2E3218; --c6-fg:#C9D48C;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding:0 16px}
.wrap{max-width:1280px;margin:0 auto;padding-block:28px 48px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:22px}
h1{font:400 clamp(30px,5vw,44px)/1.05 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.title-row{display:flex;align-items:center;gap:12px}
.gh{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;color:var(--muted);flex-shrink:0}
.gh:hover{color:var(--ink);background:var(--sunk)}
.nav{font-size:14px;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:4px 12px;background:var(--surface);white-space:nowrap}
.nav:hover{background:var(--sunk)}
.sub{color:var(--muted);margin:6px 0 0;font-size:14px}
.sub b{color:var(--ink);font-weight:600}
.search{position:relative;flex:1 1 280px;max-width:420px}
.search input{width:100%;font:inherit;padding:10px 14px 10px 38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
input:focus-visible,button:focus-visible,tr:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}
aside.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);overflow:auto;padding-right:4px}
.filters-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px;min-height:28px}
.filters-head .eyebrow{margin-right:auto}
.phone-flex,.phone-block{display:none}
.close-filters{place-items:center;border:0;background:none;padding:0 2px;font:400 20px/16px var(--body);color:var(--muted);cursor:pointer}
.close-filters:hover{color:var(--ink);background:none}
.filters-done{position:sticky;bottom:0;margin:10px -14px -10px;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--surface);border-top:1px solid var(--line);border-radius:0 0 12px 12px}
.done-btn{width:100%;font:600 15px var(--body);padding:12px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;font:inherit;font-size:13px;color:var(--accent);cursor:pointer}
.linkbtn:hover{text-decoration:underline}
details.facet{border-top:1px solid var(--line);padding-block:10px}
details.facet summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
details.facet summary::-webkit-details-marker{display:none}
details.facet summary::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);margin:-4px 4px 0 2px}
details.facet[open] summary::after{transform:rotate(-135deg);margin-top:4px}
details.facet summary > .name{flex:1}
.facet .clear{font-weight:400}
.facet .n-sel{font:500 11px var(--body);background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:1px 7px}
.facet-search{width:100%;font:inherit;font-size:13px;margin:8px 0 4px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
/* Each option is 30px tall with a 1px gap, so this shows four and scrolls the rest. */
.opts{max-height:123px;overscroll-behavior:contain;overflow:auto;margin-top:6px;display:flex;flex-direction:column;gap:1px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;height:30px;flex-shrink:0;padding:0 6px;border-radius:6px;cursor:pointer;font-size:14px}
.opt:hover{background:var(--sunk)}
.opt input{accent-color:var(--accent);margin:0}
.opt > span:not(.c){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .c{font:12px var(--mono);color:var(--faint);font-variant-numeric:tabular-nums}
.opt.zero{opacity:.42}
.opt .blank{font-style:italic;color:var(--muted)}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:34px;margin-bottom:10px}
.count{font-size:14px;color:var(--muted);margin-right:6px}
.count b{color:var(--ink);font-variant-numeric:tabular-nums}
.total{margin-left:auto;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:flex-end;gap:2px 8px;font-size:14px;color:var(--muted);text-align:right}
.total b{font:500 15px var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.total small{font-size:12px;color:var(--faint)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--ink);border:0;border-radius:99px;padding:4px 6px 4px 11px;font:inherit;font-size:13px;cursor:pointer}
.chip span{color:var(--muted)}
.chip i{font-style:normal;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;color:var(--accent);font-size:15px;line-height:1}
.chip:hover i{background:var(--accent);color:var(--accent-ink)}
.show-filters{display:none}
.mobile-sort{display:none;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.mobile-sort select{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px;max-width:190px}

.table-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:calc(100vh - 140px)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{position:sticky;top:0;z-index:1;background:var(--surface);text-align:left;border-bottom:1px solid var(--line);padding:0;white-space:nowrap}
th button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:6px;width:100%;padding:11px 14px;cursor:pointer;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
th button:hover{color:var(--ink)}
th button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
th[aria-sort] button{color:var(--accent)}
.arrow{display:inline-block;width:9px;opacity:.35}
th[aria-sort] .arrow{opacity:1}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
td.img-cell{padding:6px 0 6px 10px;width:82px}
th.img-cell{width:82px}
.thumb-box{display:block;width:72px;height:72px;border-radius:8px;overflow:hidden;background:var(--sunk)}
/* The photos are tall, so show the full width and crop the top and bottom to a square around the flower head. */
.thumb{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 36%}
.hero{display:block;width:100%;height:auto;flex-shrink:0;background:var(--sunk) center/cover no-repeat;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
td.first{font-family:var(--display);font-size:16px;white-space:nowrap}
td .line2{display:block;color:var(--muted);font-size:12.5px}
.mono{font-family:var(--mono);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:99px}
.pill.yes{background:var(--moss-soft);color:var(--moss)}
.pill.no{background:var(--sunk);color:var(--muted)}
.phone-only{display:none}
.pill.c1{background:var(--c1-bg);color:var(--c1-fg)} .pill.c2{background:var(--c2-bg);color:var(--c2-fg)}
.pill.c3{background:var(--c3-bg);color:var(--c3-fg)} .pill.c4{background:var(--c4-bg);color:var(--c4-fg)}
.pill.c5{background:var(--c5-bg);color:var(--c5-fg)} .pill.c6{background:var(--c6-bg);color:var(--c6-fg)}
.pill.chip-col{white-space:nowrap}
.pill.swatch-pill{display:inline-flex;align-items:center;gap:6px;background:var(--sunk);color:var(--ink);font-weight:500;white-space:nowrap}
.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.opt .swatch{margin-right:6px;vertical-align:-1px}
.swatches{display:inline-flex;flex-wrap:wrap;gap:4px}
.num{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 6px;border-radius:6px;background:var(--clay-soft);color:var(--clay);font:500 12px var(--mono)}
.dash{color:var(--faint)}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
a{color:var(--accent)}

.to-top{position:fixed;right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:10;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px rgba(0,0,0,.22);cursor:pointer;transition:opacity .2s,transform .2s}
.to-top.off{opacity:0;transform:translateY(8px);pointer-events:none}
.to-top:hover{filter:brightness(1.08)}
@media (prefers-reduced-motion:reduce){.to-top{transition:none}}

/* detail sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,11,.42);z-index:20;display:flex;justify-content:flex-end}
.sheet{background:var(--surface);width:min(460px,100%);height:100%;overflow:auto;box-shadow:var(--shadow);padding:calc(env(safe-area-inset-top,0px) + 20px) 24px calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;flex-direction:column;gap:18px;animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-nav{display:flex;align-items:center;gap:6px}
.sheet-nav .pos{font:12px var(--mono);color:var(--muted);margin-right:auto}
.iconbtn{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:16px}
.iconbtn:hover:not(:disabled){background:var(--sunk)}
.iconbtn:disabled{opacity:.35;cursor:default}
.sheet h2{font:400 32px/1.1 var(--display);margin:0;text-wrap:balance}
.sheet h2 .variety{display:block;margin-top:6px;font:500 15px/1.3 var(--body);color:var(--muted)}
td.first .variety{display:block;font:500 12.5px/1.3 var(--body);color:var(--muted)}
dl.fields{margin:0;display:grid;grid-template-columns:auto 1fr;border-top:1px solid var(--line)}
dl.fields dt,dl.fields dd{padding:10px 0;border-bottom:1px solid var(--line);margin:0}
dl.fields dt{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-right:20px;padding-top:13px}
dl.fields dd{white-space:pre-line}
.siblings h3{margin:0 0 8px}
.sib{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-size:14px;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 2px;color:var(--ink);cursor:pointer}
.sib:hover{color:var(--accent)}
.sib .from{color:var(--muted);font-size:13px;text-align:right}
.sib-thumb{display:block;width:32px;height:40px;border-radius:4px;object-fit:cover;background:var(--sunk)}

@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  main{min-width:0}
  aside.filters{display:none;position:static;max-height:none;overflow:visible;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 14px 10px}
  aside.filters.open{display:block}
  .show-filters{display:inline-flex}
  .phone-flex{display:grid}
  .phone-block{display:block}
  .table-box{max-height:none}
  .sheet{width:100%;height:auto;max-height:88%;margin-top:auto;border-radius:16px 16px 0 0}
  .scrim{align-items:flex-end}
}
@media (max-width:640px){
  .wrap{padding-block:18px 32px}
  .search{max-width:none}
  .mobile-sort{display:inline-flex;margin-left:auto}
  .total{margin-left:auto}
  .bar{gap:8px 10px}
  .sub{font-size:13px}
  tbody tr{gap:5px}
  .pill{font-size:11.5px;padding:1px 8px}
  .hero{height:min(46vh,380px);object-fit:cover;object-position:50% 36%}
  .sheet{padding-inline:18px;gap:14px}
  .sheet h2{font-size:28px}
  dl.fields dt{padding-right:14px}
  .table-box{overflow:visible}
  table,tbody{display:block}
  thead{display:none}
  tbody tr{display:flex;flex-wrap:wrap;align-items:center;gap:6px;position:relative;min-height:96px;padding:12px 12px 12px 96px;border-bottom:1px solid var(--line)}
  tbody tr:last-child{border-bottom:0}
  tbody tr:hover{background:var(--sunk)}
  tbody tr:hover td{background:none}
  td{display:block;padding:0;border:0}
  td.nil{display:none}
  td.img-cell{position:absolute;left:12px;top:12px;width:auto;padding:0}
  td.first{order:1;flex-basis:100%;padding-right:76px;white-space:normal;font-size:17px;line-height:1.25}
  td.first .variety{display:inline;margin-left:6px;font-size:13px}
  td[data-col="price"]{position:absolute;right:12px;top:14px}
  td[data-col="colour"]{order:2}
  td[data-col="where from"]{order:3}
  td[data-col="native"]{order:4}
  tbody tr td[data-col="excess"]{display:none}
  td[data-col="description"]{order:6;flex-basis:100%;font-size:13px;color:var(--muted)}
  td[data-col="description"] .line2{display:inline;font-size:inherit}
  td[data-col="description"] .line2::before{content:" · "}
  td[data-label]{display:inline-flex;align-items:center;gap:4px}
  td[data-label]::before{content:attr(data-label);font-size:12px;color:var(--muted)}
  td.nil[data-label]{display:none}
  td[data-bool="no"]{display:none}
  .wide-only{display:none}
  .phone-only{display:inline-block}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="title-row">
        <h1>Flower Inventory</h1>
        <a class="gh" href="https://github.com/dezzaCodes/flower-inventory" target="_blank" rel="noopener" aria-label="View the code on GitHub" title="View the code on GitHub">
          <svg width="22" height="22" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
        <a class="nav" href="money.html">Money →</a>
      </div>
      <p class="sub" id="sub"></p>
    </div>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search every column…" aria-label="Search every column" autocomplete="off">
    </label>
  </header>

  <div class="layout">
    <aside class="filters" id="filters" aria-label="Filters">
      <div class="filters-head"><span class="eyebrow">Filter by column</span><button class="linkbtn" id="clearAll" hidden>Clear all</button><button class="close-filters phone-flex" id="closeFilters" type="button" aria-label="Close filters">×</button></div>
      <div id="facets"></div>
      <div class="filters-done phone-block"><button class="done-btn" id="doneFilters" type="button">Show flowers</button></div>
    </aside>
    <main>
      <div class="bar" id="bar"></div>
      <div class="table-box" id="tableBox"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table><div class="empty" id="empty" hidden>No flowers match these filters.</div></div>
    </main>
  </div>
</div>
<button class="to-top off" id="toTop" type="button" aria-label="Back to top" title="Back to top" tabindex="-1">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>

<script>
(() => {
const DATA = JSON.parse(document.getElementById('flower-data').textContent);
// Sentence case: capitalise the first letter of each line, keep the rest, and keep place names capitalised.
const PROPER = ['Hong Kong', 'New York', 'Abu Dhabi'];
const PROPER_RE = new RegExp('\\b(' + PROPER.map(p => p.replace(/ /g, '\\s+')).join('|') + ')\\b', 'gi');
const sentence = s => s.split('\n').map(l => {
  l = l.trim();
  l = l.charAt(0).toUpperCase() + l.slice(1);
  return l.replace(PROPER_RE, m => PROPER.find(p => p.toLowerCase() === m.toLowerCase().replace(/\s+/g, ' ')) || m);
}).join('\n');
const COLS = DATA.columns.map(c => sentence(String(c)));
const BLANK = '\u0000blank';
const MONEY = /^([\d.,]+)\s*([A-Za-z]{3})$/;
// Values to show when a cell is blank, by column name.
const BLANK_AS = { excess: '0' };
// Colour columns can list several colours separated by commas, e.g. "Pink, Orange".
const SWATCH_COLS = ['colour', 'color'];
const splitCell = (name, x) => x.split(SWATCH_COLS.includes(name.toLowerCase()) ? /[\n,]+/ : /\n+/).map(t => sentence(t.trim())).filter(Boolean);
const ROWS = DATA.rows.map((r, i) => {
  const v = COLS.map((name, c) => sentence(String(r[c] ?? '').trim()) || BLANK_AS[name.toLowerCase()] || '');
  return { i, v, hay: v.join(' \n ').toLowerCase(),
    tok: v.map((x, c) => x ? [...new Set(splitCell(COLS[c], x))] : [BLANK]) };
});

const kindOf = c => {
  const vals = ROWS.map(r => r.v[c]).filter(Boolean);
  if (!vals.length) return 'empty';
  if (vals.every(v => /^https?:\/\//i.test(v))) return 'url';
  if (vals.every(v => v !== '' && !isNaN(Number(v)))) return 'number';
  if (vals.every(v => MONEY.test(v))) return 'money';
  if (vals.every(v => /^(yes|no)$/i.test(v))) return 'bool';
  return 'text';
};
const META = COLS.map((name, c) => ({ name, c, kind: kindOf(c) }));
// Column order for the table, filters and detail panel; columns not listed follow in sheet order.
const ORDER = ['flower', 'colour', 'description', 'where from', 'native', 'price', 'excess'];
const rank = m => { const k = ORDER.indexOf(m.name.toLowerCase()); return k < 0 ? ORDER.length + m.c : k; };
const ORDERED = [...META].sort((a, b) => rank(a) - rank(b));
const SHOWN = ORDERED.filter(m => m.kind !== 'empty');
// Columns that get no filter list in the sidebar; search still covers them.
const NO_FILTER = ['description'];
const FACETED = SHOWN.filter(m => m.kind !== 'url' && !NO_FILTER.includes(m.name.toLowerCase()));

const money = s => { const m = s.match(MONEY); return [m[2].toUpperCase(), parseFloat(m[1].replace(/,/g, ''))]; };
const cmpVal = (kind, x, y) => {
  if (kind === 'number') return Number(x) - Number(y);
  if (kind === 'money') { const [ac, an] = money(x), [bc, bn] = money(y); return ac.localeCompare(bc) || an - bn; }
  return x.localeCompare(y, undefined, { numeric: true, sensitivity: 'base' });
};

let IMGS = {};
const HAS_IMG = DATA.images > 0;
// High-resolution photo files by row ({src, w, h}), for the detail panel. The thumbnail shows behind each one until it loads.
const PHOTOS = DATA.photos || {};
const thumb = (r, cls) => IMGS[r.i]
  ? h('img', { class: cls, src: IMGS[r.i], alt: r.v[0] ? `${r.v[0]}, ${r.v[2] || ''}`.replace(/, $/, '') : '', loading: 'lazy', decoding: 'async' })
  : h('span', { class: cls, 'aria-hidden': 'true' });
const colIdx = name => META.findIndex(m => m.name.toLowerCase() === name);

// Columns shown as colour-coded chips. Each distinct value gets its own colour, in alphabetical order.
const CHIP_COLS = ['where from'];
const chipColour = new Map();
META.filter(m => CHIP_COLS.includes(m.name.toLowerCase())).forEach(m => {
  const vals = [...new Set(ROWS.map(r => r.v[m.c]).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  chipColour.set(m.c, new Map(vals.map((v, k) => [v, 'c' + (k % 6 + 1)])));
});
// Colour columns show a swatch of the named colour beside the value.
const SWATCHES = { red: '#D2353B', pink: '#EC86B0', orange: '#F08A35', yellow: '#F3CB45', green: '#4C9A58', blue: '#4B80D2',
  purple: '#8B5CC4', white: '#FFFFFF', cream: '#F2E6C4', brown: '#7B5535', black: '#222222', grey: '#9A9A9A',
  multicolour: 'conic-gradient(#D2353B, #F3CB45, #4C9A58, #4B80D2, #8B5CC4, #D2353B)' };
const swatchCols = new Set(META.filter(m => SWATCH_COLS.includes(m.name.toLowerCase())).map(m => m.c));
const swatch = v => SWATCHES[v.toLowerCase()] ? h('span', { class: 'swatch', style: 'background:' + SWATCHES[v.toLowerCase()], 'aria-hidden': 'true' }) : null;
const chip = (c, v) => h('span', { class: 'pill chip-col ' + (chipColour.get(c)?.get(v) || 'no') }, v);

const state = { q: '', sort: { c: 0, dir: 1 }, sel: new Map(), view: [] };

const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, val] of Object.entries(attrs)) {
    if (val == null || val === false) continue;
    if (k === 'class') el.className = val;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), val);
    else el.setAttribute(k, val === true ? '' : val);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
};

// replaceChildren would print null/false as text, so drop empty parts first.
const fill = (el, ...kids) => el.replaceChildren(...kids.flat().filter(k => k != null && k !== false));

// ---------- header ----------
const synced = DATA.synced ? new Date(DATA.synced) : null;
document.getElementById('sub').append(
  h('b', {}, ROWS.length), ' flowers',
  synced ? ` · synced ${synced.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' })}` : '',
  ...(DATA.sheet ? [synced ? ' from ' : ' · From ', h('a', { href: DATA.sheet, target: '_blank', rel: 'noopener' },
    DATA.sheetTitle || 'the Google Sheet')] : [])
);

// ---------- filtering ----------
const passes = (r, skip) => {
  if (state.q && !r.hay.includes(state.q)) return false;
  for (const [c, set] of state.sel) {
    if (c === skip || !set.size) continue;
    if (!r.tok[c].some(t => set.has(t))) return false;
  }
  return true;
};

// ---------- facets ----------
const facetEls = new Map();
const facetsBox = document.getElementById('facets');
for (const m of FACETED) {
  const counts = new Map();
  ROWS.forEach(r => r.tok[m.c].forEach(t => counts.set(t, (counts.get(t) || 0) + 1)));
  const toks = [...counts.keys()].sort((a, b) => (a === BLANK) - (b === BLANK) || cmpVal(m.kind, a, b));
  const items = new Map();
  const list = h('div', { class: 'opts' });
  for (const t of toks) {
    const cb = h('input', { type: 'checkbox', id: `f-${m.c}-${items.size}`, onchange: () => {
      const set = state.sel.get(m.c) || new Set();
      cb.checked ? set.add(t) : set.delete(t);
      state.sel.set(m.c, set);
      update();
    }});
    const count = h('span', { class: 'c' });
    const label = h('label', { class: 'opt', for: cb.id }, cb,
      t === BLANK ? h('span', { class: 'blank' }, '(blank)') : h('span', {}, swatchCols.has(m.c) ? [swatch(t), ' '] : null, t), count);
    items.set(t, { label, cb, count, text: t === BLANK ? '' : t.toLowerCase() });
    list.append(label);
  }
  const nSel = h('span', { class: 'n-sel', hidden: true });
  const clear = h('button', { class: 'linkbtn clear', type: 'button', hidden: true, 'aria-label': `Clear ${m.name} filter`,
    onclick: e => { e.preventDefault(); e.stopPropagation(); state.sel.delete(m.c); update(); } }, 'Clear');
  const summary = h('summary', {}, h('span', { class: 'name' }, m.name), nSel, clear);
  const kids = [summary];
  if (toks.length > 10 && m.kind !== 'money') { // prices are a short sorted list, so no search box
    kids.push(h('input', { class: 'facet-search', type: 'search', id: `fs-${m.c}`, placeholder: `Find a ${m.name.toLowerCase()}…`, 'aria-label': `Find a ${m.name.toLowerCase()}`,
      oninput: e => { const s = e.target.value.trim().toLowerCase(); items.forEach(it => it.label.hidden = !!s && !it.text.includes(s)); } }));
  }
  kids.push(list);
  const det = h('details', { class: 'facet', open: true }, kids);
  facetsBox.append(det);
  facetEls.set(m.c, { items, nSel, clear });
}

const updateFacets = () => {
  for (const m of FACETED) {
    const { items, nSel, clear } = facetEls.get(m.c);
    const counts = new Map();
    ROWS.forEach(r => { if (passes(r, m.c)) r.tok[m.c].forEach(t => counts.set(t, (counts.get(t) || 0) + 1)); });
    const sel = state.sel.get(m.c) || new Set();
    items.forEach((it, t) => {
      const n = counts.get(t) || 0;
      it.count.textContent = n;
      it.cb.checked = sel.has(t);
      it.label.classList.toggle('zero', !n && !sel.has(t));
    });
    nSel.hidden = clear.hidden = !sel.size; nSel.textContent = sel.size;
  }
};

// ---------- table ----------
const thead = document.getElementById('thead');
const renderHead = () => {
  thead.replaceChildren(...(HAS_IMG ? [h('th', { class: 'img-cell' }, h('span', { class: 'sr' }, 'Image'))] : []), ...SHOWN.map(m => {
    const on = state.sort.c === m.c;
    return h('th', { 'aria-sort': on ? (state.sort.dir > 0 ? 'ascending' : 'descending') : null },
      h('button', { type: 'button', onclick: () => {
        state.sort = { c: m.c, dir: on ? -state.sort.dir : 1 };
        update();
      }}, m.name, h('span', { class: 'arrow', 'aria-hidden': 'true' }, on && state.sort.dir < 0 ? '↓' : '↑')));
  }));
};

// "Chrysanthemum (one ply)" -> name "Chrysanthemum" with "One ply" shown as a subtext underneath.
const splitName = v => {
  const m = v.match(/^(.*?)\s*\(([^()]+)\)\s*$/);
  return m && m[1] ? [m[1], sentence(m[2].trim())] : [v, ''];
};
const nameParts = v => { const [name, variety] = splitName(v); return [name, variety ? h('span', { class: 'variety' }, variety) : null]; };

const cell = (m, v, first) => {
  if (!v) return h('span', { class: 'dash' }, '—');
  if (first) return nameParts(v);
  if (chipColour.has(m.c)) return chip(m.c, v);
  if (swatchCols.has(m.c)) return h('span', { class: 'swatches' }, splitCell(m.name, v).map(t => h('span', { class: 'pill swatch-pill' }, swatch(t), t)));
  if (m.kind === 'bool') return [h('span', { class: 'pill wide-only ' + v.toLowerCase() }, v),
    /^yes$/i.test(v) ? h('span', { class: 'pill phone-only yes' }, m.name) : null];
  if (m.kind === 'number') return h('span', { class: 'num' }, v);
  if (m.kind === 'money') return h('span', { class: 'mono' }, v);
  if (m.kind === 'url') return h('a', { href: v, target: '_blank', rel: 'noopener', onclick: e => e.stopPropagation() }, 'Open ↗');
  const lines = v.split(/\n+/);
  return [lines[0], ...lines.slice(1).map(l => h('span', { class: 'line2' }, l))];
};

const tbody = document.getElementById('tbody');
const renderBody = () => {
  tbody.replaceChildren(...state.view.map((r, idx) => h('tr', { tabindex: 0,
    onclick: () => openDetail(idx),
    onkeydown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDetail(idx); } } },
    HAS_IMG ? h('td', { class: 'img-cell' }, h('span', { class: 'thumb-box' }, thumb(r, 'thumb'))) : null,
    SHOWN.map((m, k) => h('td', {
      class: [k === 0 ? 'first' : '', !r.v[m.c] || (m.kind === 'number' && Number(r.v[m.c]) === 0) ? 'nil' : ''].join(' ').trim() || null,
      'data-col': m.name.toLowerCase(),
      'data-label': m.kind === 'number' ? m.name : null,
      'data-bool': m.kind === 'bool' ? (/^yes$/i.test(r.v[m.c]) ? 'yes' : 'no') : null,
    }, cell(m, r.v[m.c], k === 0))))));
  document.getElementById('empty').hidden = state.view.length > 0;
};

// ---------- bar ----------
const bar = document.getElementById('bar');
const filtersEl = document.getElementById('filters');
const nActive = () => [...state.sel.values()].reduce((a, s) => a + s.size, 0);
// ---------- total, converted to Australian dollars at the latest exchange rate ----------
const PRICE = META.find(m => m.kind === 'money');
const HOME = 'AUD';
let FX = null; // null while loading, false if no rate service answered, else { rates, date, source }
async function loadFx() {
  const want = [...new Set(ROWS.filter(r => PRICE && r.v[PRICE.c]).map(r => money(r.v[PRICE.c])[0]))].filter(c => c !== HOME);
  const sources = [
    async () => {
      const j = await (await fetch(`https://api.frankfurter.dev/v1/latest?base=${HOME}&symbols=${want.join(',')}`)).json();
      return { rates: j.rates, date: j.date, source: 'European Central Bank' };
    },
    async () => {
      const j = await (await fetch(`https://open.er-api.com/v6/latest/${HOME}`)).json();
      return { rates: j.rates, date: new Date(j.time_last_update_unix * 1000).toISOString().slice(0, 10), source: 'ExchangeRate-API' };
    },
  ];
  FX = false;
  if (!want.length) FX = { rates: {}, date: null, source: '' };
  else for (const src of sources) {
    try { const fx = await src(); if (want.every(c => fx.rates && fx.rates[c] > 0)) { FX = fx; break; } } catch {}
  }
  renderBar();
}
const fmtHome = n => '$' + Math.round(n).toLocaleString('en-AU');
const totalEl = () => {
  if (!PRICE) return null;
  const by = new Map(); let unpriced = 0;
  state.view.forEach(r => {
    const v = r.v[PRICE.c];
    if (!v) { unpriced++; return; }
    const [cur, n] = money(v);
    by.set(cur, (by.get(cur) || 0) + n);
  });
  const parts = [...by].map(([cur, n]) => `${n.toLocaleString('en-AU', { maximumFractionDigits: 2 })} ${cur}`);
  const note = unpriced ? ` · ${unpriced} without a price` : '';
  if (FX === null) return h('span', { class: 'total' }, 'Total ', h('small', {}, 'loading exchange rates…'));
  if (!FX) return h('span', { class: 'total' }, 'Total ', h('b', {}, parts.join(' + ') || '0'),
    h('small', {}, 'exchange rates unavailable right now' + note));
  const sum = [...by].reduce((a, [cur, n]) => a + (cur === HOME ? n : n / FX.rates[cur]), 0);
  const foreign = [...by.keys()].filter(c => c !== HOME);
  const rateText = foreign.map(c => `1 ${c} = ${(1 / FX.rates[c]).toFixed(3)} ${HOME}`).join(', ');
  const day = FX.date ? new Date(FX.date + 'T00:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'short' }) : '';
  return h('span', { class: 'total', title: parts.join(' + ') + (rateText ? `\n${rateText} (${FX.source}, ${FX.date})` : '') },
    'Total ', h('b', {}, `${fmtHome(sum)} ${HOME}`),
    note ? h('small', {}, note.replace(/^ · /, '')) : null);
};

// Columns left out of the phone Sort by menu.
const PHONE_NO_SORT = ['colour', 'description', 'excess'];

const renderBar = () => {
  const chips = [];
  for (const [c, set] of state.sel) for (const t of set) {
    chips.push(h('button', { class: 'chip', type: 'button', 'aria-label': `Remove filter ${COLS[c]}: ${t === BLANK ? 'blank' : t}`,
      onclick: () => { set.delete(t); update(); } },
      h('span', {}, COLS[c] + ':'), t === BLANK ? '(blank)' : t, h('i', { 'aria-hidden': 'true' }, '×')));
  }
  const n = nActive();
  fill(bar,
    filtersEl.classList.contains('open') ? null : h('button', { class: 'chip show-filters', type: 'button', 'aria-expanded': 'false',
      onclick: () => { filtersEl.classList.add('open'); renderBar(); } }, `Filters${n ? ` (${n})` : ''}`),
    h('label', { class: 'mobile-sort' }, 'Sort by ',
      h('select', { id: 'sortSel', onchange: e => { const [c, dir] = e.target.value.split(':').map(Number); state.sort = { c, dir }; update(); } },
        SHOWN.filter(m => !PHONE_NO_SORT.includes(m.name.toLowerCase()) || state.sort.c === m.c)
          // Yes/no columns get one option that puts the yeses first ("No" < "Yes", so descending).
          .flatMap(m => (m.kind === 'bool' ? [-1] : [1, -1]).map(dir => h('option', { value: `${m.c}:${dir}`, selected: state.sort.c === m.c && (m.kind === 'bool' || state.sort.dir === dir) || null },
            m.kind === 'bool' ? `${m.name} first`
              : `${m.name} ${m.kind === 'number' || m.kind === 'money' ? (dir > 0 ? '(low–high)' : '(high–low)') : (dir > 0 ? '(A–Z)' : '(Z–A)')}`))))),
    h('span', { class: 'count' }, 'Showing ', h('b', {}, state.view.length), ' of ', h('b', {}, ROWS.length), ' flowers'),
    ...chips, totalEl());
  document.getElementById('clearAll').hidden = !n;
  syncToTop();
  document.getElementById('doneFilters').textContent = `Show ${state.view.length} flower${state.view.length === 1 ? '' : 's'}`;
};
document.getElementById('clearAll').onclick = () => { state.sel.clear(); update(); };
// Phones: close the filter panel and bring the results into view.
const closeFilters = () => {
  filtersEl.classList.remove('open');
  renderBar();
  const top = bar.getBoundingClientRect().top;
  if (top < 0) window.scrollTo({ top: window.scrollY + top - 12 });
};
document.getElementById('closeFilters').onclick = closeFilters;
document.getElementById('doneFilters').onclick = closeFilters;

// ---------- update ----------
function update(toTop = true) {
  const { c, dir } = state.sort; const kind = META[c].kind;
  state.view = ROWS.filter(r => passes(r)).sort((a, b) => {
    const x = a.v[c], y = b.v[c];
    if (!x !== !y) return x ? -1 : 1; // blanks always last
    return (x ? dir * cmpVal(kind, x, y) : 0) || (c !== 0 && a.v[0].localeCompare(b.v[0])) || a.i - b.i;
  });
  renderHead(); renderBody(); renderBar(); updateFacets();
  if (toTop) scrollToTable();
}

let qTimer;
document.getElementById('q').addEventListener('input', e => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { state.q = e.target.value.trim().toLowerCase(); update(); }, 120);
});

// ---------- detail sheet ----------
const scrim = document.getElementById('scrim'), sheet = document.getElementById('sheet');
let cur = -1, lastFocus = null;
function openDetail(idx) {
  if (cur < 0) lastFocus = document.activeElement;
  cur = idx;
  const r = state.view[idx];
  const DESC = colIdx('description'), FROM = colIdx('where from');
  const sibs = ROWS.filter(o => o !== r && o.v[0] && o.v[0].toLowerCase() === r.v[0].toLowerCase());
  const close = h('button', { class: 'iconbtn', type: 'button', 'aria-label': 'Close', onclick: closeDetail }, '×');
  fill(sheet,
    h('div', { class: 'sheet-nav' },
      h('span', { class: 'pos' }, `${idx + 1} / ${state.view.length}`),
      h('button', { class: 'iconbtn', type: 'button', 'aria-label': 'Previous', disabled: idx === 0 || null, onclick: () => openDetail(idx - 1) }, '←'),
      h('button', { class: 'iconbtn', type: 'button', 'aria-label': 'Next', disabled: idx === state.view.length - 1 || null, onclick: () => openDetail(idx + 1) }, '→'),
      close),
    HAS_IMG && (PHOTOS[r.i] || IMGS[r.i]) ? h('img', { class: 'hero', src: PHOTOS[r.i]?.src || IMGS[r.i], alt: '', decoding: 'async',
      width: PHOTOS[r.i]?.w, height: PHOTOS[r.i]?.h,
      style: PHOTOS[r.i] && IMGS[r.i] ? `background-image:url("${IMGS[r.i]}")` : null }) : null,
    h('h2', { id: 'sheetTitle' }, r.v[0] ? nameParts(r.v[0]) : '(untitled)'),
    h('dl', { class: 'fields' }, ORDERED.filter(m => m.c !== 0 && m.kind !== 'empty' && m.name.toLowerCase() !== 'image').flatMap(m => [
      h('dt', {}, m.name),
      h('dd', {}, !r.v[m.c] ? h('span', { class: 'dash' }, '—')
        : m.kind === 'url' ? h('a', { href: r.v[m.c], target: '_blank', rel: 'noopener' }, r.v[m.c])
        : m.kind === 'bool' ? h('span', { class: 'pill ' + r.v[m.c].toLowerCase() }, r.v[m.c])
        : m.kind === 'text' && !chipColour.has(m.c) && !swatchCols.has(m.c) ? r.v[m.c] : cell(m, r.v[m.c]))
    ])),
    sibs.length ? h('div', { class: 'siblings' },
      h('h3', { class: 'eyebrow' }, `Other ${splitName(r.v[0]).filter(Boolean).join(', ')} entries (${sibs.length})`),
      sibs.map(o => h('button', { class: 'sib', type: 'button', onclick: () => {
        let j = state.view.indexOf(o);
        if (j < 0) { state.view.splice(idx + 1, 0, o); renderBody(); j = idx + 1; }
        openDetail(j);
      }}, HAS_IMG ? thumb(o, 'sib-thumb') : h('span'),
         h('span', {}, (DESC >= 0 ? o.v[DESC].split('\n')[0] : '') || '—'),
         h('span', { class: 'from' }, FROM >= 0 && o.v[FROM] ? (chipColour.has(FROM) ? chip(FROM, o.v[FROM]) : o.v[FROM]) : '')))) : null
  );
  scrim.hidden = false;
  close.focus();
}
function closeDetail() {
  scrim.hidden = true; cur = -1;
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}
scrim.addEventListener('click', e => { if (e.target === scrim) closeDetail(); });
document.addEventListener('keydown', e => {
  if (cur < 0) return;
  if (e.key === 'Escape') closeDetail();
  else if (e.key === 'ArrowLeft' && cur > 0) openDetail(cur - 1);
  else if (e.key === 'ArrowRight' && cur < state.view.length - 1) openDetail(cur + 1);
});

loadFx();
if (HAS_IMG) fetch('images.json').then(res => res.ok ? res.json() : {}).then(j => {
  IMGS = j || {};
  renderBody();
  if (cur >= 0) openDetail(cur);
}).catch(() => {});

// After a filter, search or sort change, show the first rows: reset the table's own scroll and,
// if the page is scrolled past the table's top, bring it back into view.
function scrollToTable() {
  const box = document.getElementById('tableBox');
  box.scrollTop = 0;
  const top = bar.getBoundingClientRect().top;
  if (top < 0) {
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({ top: window.scrollY + top - 12, behavior: reduce ? 'auto' : 'smooth' });
  }
}

// Back-to-top button. Wide screens scroll the table inside its box and phones scroll the page, so watch both.
// Hidden while the phone filter panel is open, where it would cover the "Show N flowers" button.
const toTop = document.getElementById('toTop'), tableBox = document.getElementById('tableBox');
function syncToTop() {
  const off = filtersEl.classList.contains('open') || (window.scrollY < window.innerHeight * 0.8 && tableBox.scrollTop < tableBox.clientHeight * 0.8);
  toTop.classList.toggle('off', off); toTop.tabIndex = off ? -1 : 0;
}
window.addEventListener('scroll', syncToTop, { passive: true });
tableBox.addEventListener('scroll', syncToTop, { passive: true });
toTop.addEventListener('click', () => {
  const behavior = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
  if (tableBox.scrollTop) tableBox.scrollTo({ top: 0, behavior });
  if (window.scrollY) window.scrollTo({ top: 0, behavior });
});

update(false);
})();
</script>

</body>
</html>
